<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="chatboxlooks.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2.1.1/css/pico.classless.conditional.jade.css">
    <title>Document</title>
</head>
<body>
    <main class="Chat">
        <div class="chat-messages" id="chatMessages" aria-live="polite"></div>
        <div class="chat-input">
            <label class="visually-hidden" for="userInput">Message</label>
            <textarea
                id="userInput"
                placeholder="Message ChatGPT..."
            ></textarea>

            <button id="sendButton" type="button">Send</button>
        </div>
    </main>
    <hr>
    <div class="savedPlaylists">
        
    </div>

    <script src="Js.js"></script>
</body>
</html>
